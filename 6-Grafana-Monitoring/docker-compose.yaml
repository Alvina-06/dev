
services:
  delivery-service:
    build: .
    container_name: delivery-service
    ports:
      - "8000:8000"

  # prometheus:
  #   image: prom/prometheus
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
